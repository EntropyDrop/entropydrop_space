[package]
name = "space-native"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
egui = "0.33"
egui-winit = { version = "0.33", default-features = false, features = ["clipboard", "links"] }
flate2 = "1"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
gltf = { version = "1.4", features = ["KHR_materials_pbrSpecularGlossiness"] }
lewton = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ufbx = "0.11.5"
zip = { version = "4", default-features = false, features = ["deflate"] }
png = "0.18"
prost = "0.14"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"

[build-dependencies]
prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
