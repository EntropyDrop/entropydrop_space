<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'none'">
  <title>EntropyDrop · Space — Programmable Voxel Physics World</title>
  <meta name="description" content="An AI-native programmable voxel physics world: one block in any color, 1m standard voxels with 8x8x8 micro-carving, rigid-body entities and natural-language force controllers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2220%22 y=%2220%22 width=%2260%22 height=%2260%22 fill=%22%233c8527%22 stroke=%22%23111111%22 stroke-width=%2210%22/></svg>">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="space-entry-gate" class="space-entry-gate" role="status" aria-live="polite">
    <div class="space-entry-card">
      <div class="space-entry-brand">EntropyDrop · Space</div>
      <p id="space-entry-status">Verifying EntropyDrop account and downloading character skin…</p>
      <div
        id="space-entry-progress"
        class="space-entry-progress"
        role="progressbar"
        aria-labelledby="space-entry-status"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="5"
      >
        <div class="space-entry-progress-track" aria-hidden="true">
          <div id="space-entry-progress-fill" class="space-entry-progress-fill" style="width: 5%"></div>
        </div>
        <span id="space-entry-progress-value" class="space-entry-progress-value">5%</span>
      </div>
      <div id="space-entry-actions" class="space-entry-actions">
        <a id="space-entry-action" class="space-entry-action subtle" href="/skin/" hidden>Back to Main Site</a>
      </div>
    </div>
  </div>
  <!-- React owns the game canvas host and complete 2D interface. -->
  <div id="space-react-root"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
