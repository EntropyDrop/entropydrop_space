<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Torus far-surface verification</title>
<style>
body{margin:0;background:#18202c;color:#eee;font:14px system-ui}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px}label{display:flex;align-items:center;gap:6px}select,button{font:inherit}canvas{display:block;width:100%;height:calc(100vh - 112px)}output{display:block;padding:10px}
</style>
<header>
<strong>Torus / authored LOD verification</strong>
<label>View <select id="view"><option value="near">Near · detailed voxels</option><option value="handoff">Handoff · 145m</option><option value="far">Far · 450m</option><option value="hole">Across the hole</option><option value="seam">Wrapped seam</option></select></label>
<label>Source <select id="source"><option value="stream">Live streaming</option><option value="1">1m + solids</option><option value="64">64m + solids</option></select></label>
<label>Pixel error <select id="error"><option>0.5</option><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label>
<button id="move">Fly out and back</button><button id="turn">Turn in place</button><button id="refresh">Server refresh</button>
</header>
<canvas id="scene"></canvas><output id="stats">Loading v6 fixture…</output>
<script type="module">
import * as THREE from 'three';
import { World } from '@entropydrop/space-engine/voxel/World.ts';
import { bendPoint, cullChunks, hookSceneMaterials } from '@entropydrop/space-engine/torus/TorusWorld.ts';
import { parseSurfaceZoneSnapshot, createSpaceSurfaceSnapshotRemote } from '../src/bootstrap/SpaceSurfaceSnapshot.ts';
const $ = id => document.getElementById(id), canvas = $('scene');
const params=new URLSearchParams(location.search), farOnly=params.get('near')==='0';
$('source').value=params.get('source')??'1';
$('view').value=params.get('view')??'near';
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);
const scene = new THREE.Scene();scene.background=new THREE.Color('#a5c7e6');
scene.add(new THREE.HemisphereLight(0xffffff,0x687055,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-3000,5000,2000);scene.add(sun);
const world=new World(scene,20260827);world.setRenderDistance(4);
const layer=world.distantSurface;
const camera=new THREE.PerspectiveCamera(65,1,0.1,12000);
let px=8190,py=40,pz=1090, ready=false, flying=false, flightStart=0, metadata;
let stream, streamPasses=0, streaming=false, turning=false;
let lastFrame=0, lastStats=0, frameTimes=[];
function resize(){renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();}
function pose(distance){
  const view=$('view').value;
  if(distance!==undefined){px=8190-distance*.35;py=40+distance*.28;pz=1090+distance;}
  else if(view==='near'){px=8190;py=40;pz=1090;}
  else if(view==='handoff'){px=8170;py=68;pz=1180;}
  else if(view==='far'){px=8000;py=360;pz=1130;}
  else if(view==='seam'){px=16370;py=70;pz=2030;}
  else {px=8192;py=120;pz=1024;}
  if(metadata?.developmentSnapshot && view!=='seam' && view!=='hole'){
    const [x,y,z]=metadata.focus;
    const d=distance??(view==='far'?520:view==='handoff'?180:70);
    px=x+d;py=y+d*.3;pz=z+20;
  }
  camera.position.copy(bendPoint(px,py,pz));
  camera.up.copy(bendPoint(px,py+1,pz).sub(camera.position)).normalize();
  camera.lookAt(view==='hole'?new THREE.Vector3(0,0,0):view==='seam'?bendPoint(70,17,50):bendPoint(...(metadata?.focus??[8220,36,1033])));
  camera.updateMatrixWorld(true);
}
async function install(){
  if($('source').value==='stream')return poll();
  const response=await fetch(`./generated-surface/${$('source').value}.bin`);
  if(!response.ok)throw new Error('Run server/tools/generate_distant_surface_fixture.py first.');
  layer.installZone(parseSurfaceZoneSnapshot(new Uint8Array(await response.arrayBuffer())));
  await layer.finalizeConnections();
}
async function poll(){
  if(streaming || !stream || $('source').value!=='stream')return;
  streaming=true;
  try{
    await stream.loadAll(zone=>layer.installZone(zone),undefined,{
      getZoneDemand:(x,z)=>layer.getZoneDemand(x,z),getDataBudgetBytes:()=>layer.getSettings().dataBudgetMiB*1024*1024});
    await layer.finalizeConnections(false);streamPasses++;
  }finally{streaming=false;}
}
async function init(){
  metadata=await (await fetch('./generated-surface/metadata.json')).json();
  stream=createSpaceSurfaceSnapshotRemote(location.origin,'fixture',
    new URL('./generated-surface/manifest.json',location.href).href,metadata.seed,1);
  resize();pose();layer.updateView(camera,canvas.height);
  // Global low-cost overview keeps the curved background visible; the edited
  // zone is the actual server generator and binary decoder, not a mock mesher.
  const overviews=await (await fetch('./generated-surface/overviews.json')).json();
  for(const encoded of overviews)layer.installZone(parseSurfaceZoneSnapshot(Uint8Array.from(atob(encoded),c=>c.charCodeAt(0))));
  if(!overviews.length && $('source').value!=='stream')for(let x=0;x<32;x++)for(let z=0;z<4;z++){
    const heightsMicro=new Uint16Array(64).fill(136),colors=new Uint8Array(64*3);
    for(let i=0;i<64;i++)colors.set([113,143,97],i*3);
    layer.installZone({zoneX:x,zoneZ:z,seed:20260827,terrainGeneratorVersion:1,sourceTerrainRevision:0,
      sampleSize:64,samplesPerChunkAxis:.25,zoneSizeChunks:32,heightsMicro,colors});
  }
  await install();
  const edits=await (await fetch('./generated-surface/edits.json')).json();
  if(!farOnly)for(const [[cx,cz],overlay] of edits){
    for(const [x,y,z,b,c] of overlay.standard)world.setBlock(x,y,z,b,false,c);
    for(const [x,y,z,c] of overlay.micro)world.setMicroBlock(x,y,z,c);
  }
  if(!farOnly)await world.preloadTerrainAoi(px,pz);
  world.microVoxels.updateMesh();
  hookSceneMaterials(world.worldGroup);
  ready=true;
  setInterval(()=>poll().catch(console.error),1000);
}
$('view').onchange=()=>{flying=false;pose();};
$('error').onchange=()=>layer.setSettings({screenErrorPx:Number($('error').value)});
$('source').onchange=()=>install().catch(console.error);
$('refresh').onclick=()=>install().catch(console.error);
$('turn').onclick=()=>{turning=!turning;flying=false;flightStart=performance.now();};
$('move').onclick=()=>{turning=false;flying=!flying;flightStart=performance.now();$('view').value='near';};
window.addEventListener('resize',resize);
renderer.setAnimationLoop(()=>{
  const now=performance.now();
  if(lastFrame && ready){frameTimes.push(now-lastFrame);if(frameTimes.length>600)frameTimes.shift();}
  lastFrame=now;
  if(ready){
    if(flying){const phase=(performance.now()-flightStart)/10000;pose(70+(1-Math.cos(phase*Math.PI*2))*225);}
    if(turning){pose();camera.rotateY(Math.sin((now-flightStart)/3000)*Math.PI);camera.updateMatrixWorld(true);}
    if(!farOnly){
      world.updateChunksAround(px,pz);
      world.microVoxels.updateMesh();
      cullChunks(camera,world);
    }
    layer.updateView(camera,canvas.height);
  }
  renderer.render(scene,camera);
  if(ready && now-lastStats>250){
    lastStats=now;
    const sorted=[...frameTimes].sort((a,b)=>a-b), p95=sorted[Math.floor(sorted.length*.95)]??0;
    const build=layer.mesh.userData.lodBuildStats??{};
    $('stats').textContent=`Ready | ${$('view').value} | Source ${$('source').value} | Passes ${streamPasses} | Error ${layer.getSettings().screenErrorPx}px | Terrain cells ${layer.mesh.geometry.instanceCount.toLocaleString()} | Authored chunks ${layer.authoredChunks.group.children.length} | Draws ${renderer.info.render.calls} | Triangles ${renderer.info.render.triangles.toLocaleString()} | Frame p95 ${p95.toFixed(1)}ms | Builds ${build.publications??0} | Root reuse ${build.reusedRoots??0}/${(build.rebuiltRoots??0)+(build.reusedRoots??0)} | Side reuse ${build.reusedSideZones??0}/${(build.rebuiltSideZones??0)+(build.reusedSideZones??0)} | GPU geometries ${renderer.info.memory.geometries}`;
  }
});
init().catch(e=>{$('stats').textContent=String(e);console.error(e);});
</script>
</html>
