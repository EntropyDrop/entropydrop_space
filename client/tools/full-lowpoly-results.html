<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full-scene terrain performance</title>
<style>body{max-width:1200px;margin:24px auto;padding:0 20px;background:#111a23;color:#e6edf4;font:15px system-ui;line-height:1.5}table{border-collapse:collapse;width:100%;margin:16px 0}td,th{padding:7px;border-bottom:1px solid #344454;text-align:right}td:first-child,th:first-child{text-align:left}button{padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Full-scene terrain performance</h1>
<p>Ordinary offline game frames, including near terrain, PBR, sky and HUD. These repeated-district fixtures do not measure live-server load. Raw frames and GPU timestamps remain in this tab's session storage.</p>
<main id="results"></main>
<script type="module">
const root=document.getElementById('results');
for(const key of Object.keys(sessionStorage).filter(k=>k.startsWith('full-lowpoly-')&&k.endsWith('-gzip'))){
  const section=document.createElement('section');root.append(section);
  try{
    const bytes=Uint8Array.from(atob(sessionStorage.getItem(key)),c=>c.charCodeAt(0));
    const raw=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),r=JSON.parse(raw);
    const h=document.createElement('h2');h.textContent=`${r.world} · ${r.control?'A/A control':'packed / low-poly'}`;section.append(h);
    const p=document.createElement('p');p.textContent=`${r.width}×${r.height} · ${r.quality} · ${r.pixels} px · ${r.rows.length} blocks · ${r.errors.length} errors`;section.append(p);
    const pooled=document.createElement('table');section.append(pooled);
    const quantile=(values,q)=>values.sort((a,b)=>a-b)[Math.floor(values.length*q)];
    const pooledRows=[['Motion','Role','Pooled FPS','Frame p95 ms','CPU p50 ms','GPU p50 ms']];
    for(const motion of new Set(r.rows.map(x=>x.motion)))for(const role of ['reference','candidate']){
      const selected=r.rows.filter(x=>x.motion===motion&&x.role===role),frames=selected.flatMap(x=>x.raw),gpu=selected.flatMap(x=>x.gpu.map(g=>g.spanMs));
      pooledRows.push([motion,role,(1000*frames.length/frames.reduce((n,f)=>n+f.frame,0)).toFixed(1),quantile(frames.map(f=>f.frame),.95).toFixed(2),quantile(frames.map(f=>f.cpu),.5).toFixed(2),quantile(gpu,.5).toFixed(3)]);
    }
    for(const [i,row]of pooledRows.entries()){const tr=pooled.insertRow();for(const value of row){const cell=document.createElement(i?'td':'th');cell.textContent=String(value);tr.append(cell);}}
    const b=document.createElement('button');b.textContent='Export complete JSON';b.onclick=()=>{const a=document.createElement('a');a.download=key.replace('-gzip','.json');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};section.append(b);
    const blocks=document.createElement('details'),blockSummary=document.createElement('summary');blockSummary.textContent='Individual measurement blocks';blocks.append(blockSummary);section.append(blocks);
    const t=document.createElement('table');blocks.append(t);
    const rows=[['Motion / block','Role','FPS','Frame p95 ms','CPU p50 ms','GPU p50 ms','Draw calls','Pending frames'],...r.rows.map(x=>[`${x.motion} / ${x.block}`,`${x.role} (${x.actual})`,x.fps.toFixed(1),x.metrics.frame.p95.toFixed(2),x.metrics.cpu.p50.toFixed(2),x.metrics.gpu.p50.toFixed(3),x.metrics.calls.p50,x.pendingFrames])];
    for(const [i,row]of rows.entries()){const tr=t.insertRow();for(const value of row){const cell=document.createElement(i?'td':'th');cell.textContent=String(value);tr.append(cell);}}
    const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='Measurement summaries';pre.textContent=JSON.stringify({...r,rows:r.rows.map(({raw,gpu,...row})=>row)},null,2);details.append(summary,pre);section.append(details);
  }catch(e){section.textContent=String(e);}
}
if(!root.childElementCount)root.textContent='No completed captures in this tab. Run the offline scene trial, then navigate this same tab here.';
</script></html>
